<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>選手成績ビュー</title>
  <link rel="stylesheet" href="./styles.css?v=20261029-innings">
  <link rel="stylesheet" href="./stat-help.css?v=20261029-innings">
  <script defer src="./stat-help.js?v=20261029-innings"></script>
</head>
<body>
  <div class="site-shell">
    <header class="hero">
      <div class="hero-bar">
        <div class="hero-copy">
          <p id="compareEyebrow" class="hero-kicker">Player View</p>
          <h1 id="compareTitle">選手成績ビュー</h1>
          <p id="compareSubtitle" class="compare-subtitle"></p>
        </div>
        <nav class="hero-nav" aria-label="ページ移動">
          <a class="hero-nav-link" href="./index.html">試合別成績</a>
          <a class="hero-nav-link" href="./annual.html">年度別成績</a>
          <a class="hero-nav-link" href="./ranking-pitcher.html">ランキング</a>
          <a class="hero-nav-link active" href="./player.html">個人成績</a>
        </nav>
      </div>
    </header>

    <section class="type-switch-section" aria-label="投手・打者切替">
      <div class="type-switch">
        <a id="comparePitcherTypeLink" class="type-switch-link" href="./player.html?type=pitcher">投手</a>
        <a id="compareBatterTypeLink" class="type-switch-link" href="./player.html?type=batter">打者</a>
      </div>
    </section>

    <main class="panel annual-main">
      <section class="panel-block">
        <div class="section-head compare-head">
          <div>
            <h2 id="comparePlayerName">選手を読み込み中</h2>
            <p id="compareDescription" class="compare-subtitle compare-subtitle--muted"></p>
          </div>
          <a id="compareBackLink" class="action-link secondary compare-back-link" href="./annual.html">年度別成績へ戻る</a>
        </div>
        <div id="modeToggleGroup" class="compare-mode-group"></div>
        <details id="metricControls" class="metric-controls is-hidden">
          <summary>表示する指標を選ぶ</summary>
          <div id="metricToggleGroup" class="compare-toggle-group"></div>
        </details>
      </section>

      <section id="seasonPanel" class="panel-block is-hidden">
        <div class="section-head compare-head">
          <h2>年度成績</h2>
          <span id="seasonMetricCount" class="result-count">0球</span>
        </div>
        <div id="seasonDetailWrap" class="season-detail-wrap"></div>
      </section>

      <section id="comparePanel" class="panel-block">
        <div class="section-head comparison-heading">
          <div><h2>前年比較</h2><p class="comparison-help">年度ごとの数値と、前年からの変化を確認できます。</p></div>
          <span id="compareMetricCount" class="result-count">0項目</span>
        </div>
        <div class="comparison-toolbar">
          <label class="comparison-year-picker"><span>比較する年度</span><select id="comparisonYearSelect" class="field-select"></select></label>
          <div class="comparison-presets" role="group" aria-label="比較指標の表示範囲">
            <button type="button" data-compare-preset="main" aria-pressed="true">主要指標</button>
            <button type="button" data-compare-preset="all" aria-pressed="false">すべて</button>
          </div>
          <div class="comparison-views" role="group" aria-label="前年比較の表示形式">
            <button type="button" data-compare-view="table" aria-pressed="true">一覧表</button>
            <button type="button" data-compare-view="bars" aria-pressed="false">棒グラフ</button>
          </div>
        </div>
        <div id="compareSeasonGrid" class="comparison-season-strip"></div>
        <div id="compareCardGrid" class="comparison-results" aria-live="polite"></div>
        <p id="historicalCompareNote" class="historical-source-note is-hidden"></p>
        <p class="comparison-help comparison-footnote">前年差は後の年度 − 前の年度。色は数値の増減を示します。％表示の指標はポイント差です。「—」は比較に必要なデータがない項目です。</p>
      </section>

      <section id="monthlyPanel" class="panel-block is-hidden">
        <div class="section-head compare-head">
          <h2>月別成績</h2>
          <span id="monthlyMetricCount" class="result-count">0項目</span>
        </div>
        <div id="monthlySeasonGrid" class="season-meta-grid"></div>
        <div id="monthlyTableWrap" class="monthly-table-wrap"></div>
        <div id="monthlyChartGrid" class="monthly-chart-grid"></div>
      </section>
    </main>
  </div>

  <script src="./uniform_numbers.js?v=20260711"></script>
  <script defer src="./historical-pitcher.js?v=20261029-season"></script>
  <script defer src="./historical-batter.js?v=20261029-season"></script>
  <script defer src="./compare.js?v=20261029-innings"></script>
</body>
</html>
